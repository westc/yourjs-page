<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../logo.svg" type="image/svg+xml">
  <title>YourJS Page - Libraries</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 1100px; padding: 16px; }
    #yourjs-page-wrapper { height: 600px; }
  </style>
</head>
<body>
  <h1>Libraries</h1>
  <p>This page starts with Animate.css and jQuery (from <code>data-css-urls</code> and <code>data-js-urls</code>).  Click the Libraries button in the toolbar to search for more.</p>

  <div id="yourjs-page-wrapper">
    <script src="../dist/yourjs-page.min.js"
      data-css-urls="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
      data-js-urls="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      data-html-selector="#html" data-css-selector="#css" data-js-selector="#js"></script>
  </div>

<template id="html"><h1 id="title" class="animate__animated">Hello, libraries!</h1>
<button id="bounce">Bounce</button>
<button id="shake">Shake</button></template>
<template id="css">body {
  font-family: system-ui, sans-serif;
  padding: 1em;
}</template>
<template id="js">$('#bounce, #shake').on('click', function () {
  const effect = 'animate__' + this.id;
  $('#title')
    .removeClass('animate__bounce animate__shake')
    .addClass(effect)
    .one('animationend', function () {
      $(this).removeClass(effect);
    });
  console.log('Using jQuery', $.fn.jquery, 'to', this.id);
});</template>
</body>
</html>
